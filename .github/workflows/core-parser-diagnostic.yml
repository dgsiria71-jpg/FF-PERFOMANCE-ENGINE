name: Core Parser Diagnostic

on:
  push:
    branches: [ ci/typed-benchmark-verify ]

jobs:
  core-selftest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Core self-tests with parser traces
        timeout-minutes: 3
        run: dotnet run --project tests/FFPerformanceEngine.Core.SelfTest/FFPerformanceEngine.Core.SelfTest.csproj -c Release
